# Docker keeps container logs forever by default; cap them so the disk never fills.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgres:16-alpine
    logging: *logging
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: seats
    ports: ["5433:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d seats"]
      interval: 2s
      timeout: 3s
      retries: 20
  app:
    build: .
    logging: *logging
    depends_on:
      db: { condition: service_healthy }
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/seats
      ADMIN_TOKEN: dev-admin-token
      PUBLIC_LOGS: "true"
    ports: ["8080:8080"]
