# Render Blueprint. DATABASE_URL points at a Neon (or Render) Postgres; set it in the dashboard.
services:
  - type: web
    name: seat-reservation
    runtime: docker
    plan: free
    region: ohio   # keep next to the Neon database (us-east-2) - round-trip latency dominates throughput
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_TOKEN
        sync: false
      - key: TOKEN_SECRET
        generateValue: true
      - key: ALLOW_DEV_TOKENS
        value: "true"
      - key: DB_POOL_MAX
        value: "30"
