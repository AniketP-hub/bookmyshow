spring.application.name=seat-reservation
server.port=${PORT:8080}

# Many concurrent connections: virtual threads + big accept queue; the DB pool is the real throttle.
spring.threads.virtual.enabled=true
# Admission control: only this many connections live inside the JVM at once; the rest wait in the OS accept queue
# (costs no heap). Without it a 20k-connection flood exhausts the heap and the service stops answering.
server.tomcat.max-connections=${TOMCAT_MAX_CONNECTIONS:2000}
server.tomcat.accept-count=${TOMCAT_ACCEPT_COUNT:20000}
# idle keep-alive connections occupy admission slots, so do not hold them long (too short causes client-side resets)
server.tomcat.keep-alive-timeout=${TOMCAT_KEEPALIVE:8s}
server.tomcat.connection-timeout=60s
server.shutdown=graceful

spring.jackson.property-naming-strategy=SNAKE_CASE
spring.jackson.deserialization.fail-on-unknown-properties=false

# Hikari: lazy start so the app boots (liveness ok, readiness failing) even if the DB is still waking up
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:20}
spring.datasource.hikari.connection-timeout=${DB_POOL_WAIT_MS:45000}
spring.datasource.hikari.initialization-fail-timeout=-1

# Metrics at /metrics (Prometheus text format); probes are our own /healthz and /readyz
management.endpoints.web.base-path=/
management.endpoints.web.exposure.include=prometheus
management.endpoints.web.path-mapping.prometheus=metrics
management.endpoint.health.enabled=false

# Structured (JSON) logs; MDC fields (request_id, user_id, ...) are emitted automatically
logging.structured.format.console=logstash
logging.level.root=INFO

app.admin-token=${ADMIN_TOKEN:dev-admin-token}
app.token-secret=${TOKEN_SECRET:dev-token-secret}
app.allow-dev-tokens=${ALLOW_DEV_TOKENS:true}
app.default-per-user-limit=${DEFAULT_PER_USER_LIMIT:4}
app.max-seats-per-show=${MAX_SEATS_PER_SHOW:100000}

# Optional read-only public live-log view: /logs, /logs/stream, /logs.html
app.public-logs=${PUBLIC_LOGS:false}

# Bulkhead: at most this many reserve/cancel/show requests run at once; the rest wait their turn (cheap, in order)
# instead of piling onto the small DB pool and timing out as 503s.
app.max-inflight=${MAX_INFLIGHT:400}
